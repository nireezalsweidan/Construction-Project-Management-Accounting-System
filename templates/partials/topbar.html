<header class="topbar" data-app-user-id="{{ app_user_id|default:'' }}"><button class="menu-button" data-sidebar-open>☰</button><div class="global-search"><b class="search-icon">⌕</b><input type="text" data-search-input placeholder="Search projects, invoices, suppliers…" autocomplete="off"><div class="search-dropdown" data-search-results hidden></div></div><div class="top-actions"><div class="user-menu-wrap" data-user-menu><button class="user-menu-btn" data-user-menu-toggle type="button" aria-haspopup="true" aria-expanded="false"><span class="avatar top-avatar">{{ request.user.get_full_name|default:request.user.username|slice:":2"|upper }}</span><span class="user-menu-name"><strong>{{ request.user.get_full_name|default:request.user.username }}</strong><small>{% if request.user.is_owner %}Owner{% else %}Accountant{% endif %}</small></span><svg class="user-menu-caret" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button><div class="user-menu" data-user-menu-list hidden><a class="user-menu-item" href="{% url 'profile' %}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>My profile</span></a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="user-menu-item" type="submit"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 9V5h14v14H5v-4"/><line x1="12" y1="2" x2="12" y2="12"/></svg><span>Log out</span></button></form></div></div><div class="notif-widget" data-notif-widget><button class="icon-button" aria-label="Notifications" data-notif-toggle>♧<i></i></button><span class="notif-badge" data-notif-badge hidden>0</span><div class="notif-dropdown" data-notif-dropdown hidden><div class="notif-dropdown-head"><b>Notifications</b><button type="button" data-notif-mark-all>Mark all read</button></div><div class="notif-dropdown-list" data-notif-list><p class="notif-empty">Loading…</p></div></div></div></div></header>
